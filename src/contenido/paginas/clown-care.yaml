seo:
  titulo:
    es: Qué es el clown care — Doctor Payaso A.C.
  descripcion:
    es: >-
      El clown care es una práctica de acompañamiento que integra arte clown,
      juego, improvisación, escucha y herramientas de conexión humana. En Doctor
      Payaso lo desarrollamos a través de un modelo de formación, práctica
      supervisada y coordinación con las instituciones que visitamos.
antetitulo:
  es: Nuestro método
titulo:
  es: Actos inesperados de cariño, con metodología detrás.
entrada:
  es: >-
    El clown care es una práctica de acompañamiento que integra arte clown,
    juego, improvisación, escucha y herramientas de conexión humana.


    En **Doctor Payaso** lo desarrollamos a través de un modelo de formación,
    práctica supervisada y coordinación con las instituciones que visitamos.
    Nuestro propósito es crear encuentros respetuosos y significativos que
    contribuyan a humanizar la experiencia de quienes atraviesan momentos de
    vulnerabilidad.


    **Cada persona importa. Cada encuentro es único.**
video:
  portada:
    archivo: /src/assets/paginas/clown-care/video/portada/archivo.jpg
    textoAlternativo:
      es: >-
        Un grupo de ocho voluntarios sonríe animadamente vestidos como payasos
        de hospital, portando batas blancas de médico y narices rojas. Llevan
        accesorios coloridos y llamativos, como pelucas, tocados, pines y
        collares.
    muestraPersonasIdentificables: true
    folioConsentimiento: CONS-2026-004
  enlace: https://youtu.be/5WJPHbEqr5U?si=v4dIo2Fa1shYps9d
  pie:
    es: >-
      Gracias a nuestros voluntarios por vivir nuestra misión de "Sanar con Amor
      y Alegría" ¡Ustedes SON el regalo! 
anatomia:
  titulo:
    es: ¿Qué sucede durante una visita?
  entrada:
    es: >-
      Cada intervención sigue una secuencia. No se improvisa la estructura: se
      improvisa dentro de ella.
  pasos:
    - titulo:
        es: Nos preparamos
      descripcion:
        es: >-
          Antes de cada visita, recibimos las indicaciones del personal
          responsable y revisamos las condiciones del espacio.

          La seguridad, la privacidad y el bienestar de las personas orientan
          nuestra intervención.
    - titulo:
        es: Pedimos permiso
      descripcion:
        es: >-
          Cada persona decide si desea recibirnos.

          Escuchamos su respuesta, respetamos su espacio y adaptamos el
          encuentro a sus necesidades. El respeto comienza con la libertad de
          elegir.
    - titulo:
        es: Entramos en su mundo
      descripcion:
        es: >-
          A través del juego, la improvisación y la inversión de roles,
          invitamos a la persona a participar. Puede dirigir el juego,
          enseñarnos algo, corregirnos, reír, conversar o simplemente compartir
          un momento de compañía.


          La persona marca el ritmo.
    - titulo:
        es: Cerramos con respeto
      descripcion:
        es: >-
          Cada encuentro tiene un cierre atento y cuidadoso.


          Registramos la actividad conforme a nuestros lineamientos
          institucionales y compartimos con el equipo responsable la información
          pertinente. La confidencialidad y la dignidad acompañan cada paso.
acompanamos:
  titulo:
    es: ¿A quiénes acompañamos?
  grupos:
    - icono: 🧒
      color: coral
      titulo:
        es: Niñas, niños y adolescentes
      descripcion:
        es: >-
          Creamos encuentros adaptados a su edad, intereses, estado de salud y
          disposición para participar.

          El juego puede abrir un espacio de expresión y conexión en medio de la
          experiencia hospitalaria.
    - icono: 👵
      color: azul
      titulo:
        es: Personas adultas y adultas mayores
      descripcion:
        es: >-
          Acompañamos con escucha, humor, juego y respeto por la historia y las
          preferencias de cada persona.

          Cada encuentro se construye desde su individualidad.
    - icono: 👩‍🦰
      color: coral
      titulo:
        es: Familias y cuidadores
      descripcion:
        es: >-
          Reconocemos a quienes acompañan, esperan, cuidan y sostienen.

          Una conversación, una sonrisa o un momento compartido también pueden
          ser significativos para ellos.
    - icono: 🩺
      color: teal
      titulo:
        es: Profesionales de la salud
      descripcion:
        es: >-
          Compartimos espacios de conexión y alegría con quienes dedican su vida
          a cuidar de otras personas.

          Nuestro trabajo se realiza en coordinación con las instituciones y sus
          equipos.
llamadoHospitales:
  titulo:
    es: Llevemos Doctor Payaso a tu institución
  cuerpo:
    es: >-
      Construimos programas de acompañamiento en colaboración con hospitales y
      organizaciones comprometidas con la humanización del cuidado.
  boton:
    texto:
      es: Construyamos una alianza→
    destino: /alianzas
