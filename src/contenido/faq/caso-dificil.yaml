identificador: caso-dificil
pagina: certificate
pregunta:
  es: ¿Qué pasa si me toca un caso muy duro?
respuesta:
  es: >-
    No visitas solo, nunca. Vas en dupla y con un coordinador de sede. Además existe contención emocional para el voluntario: acompañar a un paciente terminal deja huella y no te dejamos procesarlo por tu cuenta.
