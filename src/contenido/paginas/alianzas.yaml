seo:
  titulo:
    es: Alianzas institucionales — Doctor Payaso A.C.
  descripcion:
    es: >-
      Programas de clown care para hospitales, voluntariado corporativo con
      impacto medible y certificación para estudiantes de ciencias de la salud.
hero:
  antetitulo:
    es: Empresas · Hospitales · Universidades
  titulo:
    es: |-
      Juntos podemos llevar
      el amor más lejos.
  palabraDestacada:
    es: más lejos
  entrada:
    es: >-
      Creemos en las alianzas que unen capacidades, recursos y personas para
      generar un impacto social significativo.


      En **Doctor Payaso** desarrollamos programas de formación, acompañamiento
      y voluntariado con objetivos claros, procesos definidos e indicadores de
      resultados.


      **Tu organización puede formar parte de esta historia.**
  botonPrincipal:
    texto:
      es: Construyamos una alianza
    destino: '#contacto-institucional'
  botonSecundario:
    texto: {}
  insignia:
    destacado:
      es: '2015'
    etiqueta:
      es: |-
        Primer informe
        anual público
  imagen:
    archivo: /src/assets/paginas/alianzas/hero/imagen/archivo.jpg
    textoAlternativo:
      es: Mujer dando la mano de frente en señal de alianza.
    muestraPersonasIdentificables: true
    folioConsentimiento: CONS-2026-0009
modelosDeColaboracion:
  titulo:
    es: Tres caminos para colaborar
  modelos:
    - icono: 🏢
      nombre:
        es: Empresas
      paraQuien: {}
      descripcion:
        es: >-
          El compromiso social también se vive.


          Diseñamos experiencias de formación, voluntariado corporativo y
          acompañamiento que permiten a los colaboradores participar activamente
          en nuestra misión.


          Cada proyecto se construye de acuerdo con los objetivos y las
          posibilidades de la organización.
      incluye:
        - es: Programas de voluntariado corporativo
        - es: Formación y desarrollo de habilidades humanas
        - es: Proyectos de bienestar y conexión
        - es: Indicadores y reportes de impacto
      enlace:
        texto:
          es: Quiero una alianza empresarial →
        destino: '#contacto-institucional'
    - icono: 🏥
      nombre:
        es: Hospitales
      paraQuien: {}
      descripcion:
        es: >-
          Humanizar el cuidado es una tarea compartida.


          Colaboramos con instituciones de salud para llevar nuestro programa de
          clown care a pacientes, familias y profesionales de la salud.


          Nuestros voluntarios reciben formación y trabajan en coordinación con
          los equipos responsables de cada institución.
      incluye:
        - es: Programas de visitas presenciales y virtuales
        - es: Voluntariado formado y coordinado
        - es: Respeto a los protocolos institucionales
        - es: Seguimiento y registro de actividades
      enlace:
        texto:
          es: Quiero doctor payaso en mi hospital →
        destino: '#contacto-institucional'
    - icono: 🎓
      nombre:
        es: Universidades
      paraQuien: {}
      descripcion:
        es: >-
          La formación de profesionales de la salud también se construye desde
          la humanidad.


          Colaboramos con instituciones educativas para acercar a sus
          estudiantes experiencias de autoconocimiento, empatía, escucha y
          acompañamiento.


          Nuestros programas pueden adaptarse a las necesidades académicas y a
          los objetivos de cada institución.
      incluye:
        - es: Formación en clown care
        - es: Desarrollo de habilidades humanas
        - es: Experiencias prácticas supervisadas
        - es: Proyectos de vinculación y responsabilidad social
      enlace:
        texto:
          es: Quiero conocer el programa →
        destino: '#contacto-institucional'
citaInstitucional:
  texto:
    es: Llevamos el corazón en la punta de la nariz.
  autor:
    es: >-
      Doctor Payaso A.C.

      Presencia en medios: Proceso, Gaceta Facultad de Medicina UNAM, Expomed
      Hub 
proceso:
  antetitulo:
    es: Nuestra experiencia
  titulo:
    es: Alianzas que se convierten en encuentros
  entrada:
    es: >-
      Hemos colaborado con organizaciones comprometidas con la salud, la
      educación y el bienestar de las personas.


      Cada alianza nos permite ampliar nuestro alcance, fortalecer nuestra
      formación y compartir nuestra misión con nuevas comunidades.


      **El impacto comienza cuando compartimos un propósito.**
  boton:
    texto:
      es: Conoce nuestro impacto →
    destino: '#contacto-institucional'
  pasos:
    - titulo:
        es: Escuchamos
      descripcion:
        es: >-
          Conocemos a tu organización, sus objetivos y las necesidades de las
          personas a quienes desea acompañar.
    - titulo:
        es: Diseñamos
      descripcion:
        es: >-
          Construimos una propuesta con actividades, responsabilidades, recursos
          e indicadores definidos.
    - titulo:
        es: Preparamos
      descripcion:
        es: >-
          Alineamos equipos, formación, protocolos y condiciones para
          desarrollar el proyecto.
    - titulo:
        es: Implementamos
      descripcion:
        es: >-
          Ponemos en marcha las actividades en coordinación con las personas
          responsables.
    - titulo:
        es: Medimos y aprendemos
      descripcion:
        es: >-
          Documentamos los resultados y compartimos información que permite
          evaluar el alcance y fortalecer futuras acciones.
contacto:
  titulo:
    es: Hablemos de tu proyecto
  entrada:
    es: >-
      Una alianza puede cambiar muchas historias. Cuéntanos qué te gustaría
      construir.


      Nos encantará escucharte.
  recurso:
    texto:
      es: Informes anuales
    destino: /impacto
  textoDelConsentimiento:
    es: >-
      Acepto el tratamiento de mis datos de contacto profesional para dar
      seguimiento a esta solicitud, conforme a la LFPDPPP.
  textoDeExito:
    es: Recibimos tu mensaje. Te contactamos en los próximos días hábiles.
