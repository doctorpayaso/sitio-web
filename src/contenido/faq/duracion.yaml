pregunta:
  es: ¿Cuánto tiempo me va a tomar?
respuesta:
  es: >-
    El recorrido de los seis módulos más las prácticas hospitalarias. La duración exacta por sede está en la ficha de cada generación. Después de certificarte, el compromiso típico de un voluntario activo es de visitas periódicas coordinadas por tu líder de sede.
