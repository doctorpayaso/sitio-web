seo:
  titulo:
    es: Certifícate en clown care — Doctor Payaso A.C.
  descripcion:
    es: >-
      Seis módulos de formación, práctica hospitalaria acompañada y una
      comunidad que te sostiene. No necesitas experiencia en actuación.
hero:
  antetitulo:
    es: Certificación en clown care
  titulo:
    es: |-
      No buscamos payasos.
      Buscamos personas.
  palabraDestacada:
    es: personas
  entrada:
    es: >-
      No necesitas saber actuar, ni hacer malabares, ni ser gracioso. Necesitas
      estar dispuesto a exponerte, a fallar en público y a que un niño de siete
      años te mande. El resto te lo enseñamos en seis módulos.
  botonPrincipal:
    texto:
      es: Inscribirme a la próxima generación
    destino: '#solicitud'
  botonSecundario:
    texto:
      es: Ver los 6 módulos
    destino: '#modulos'
  avisoDeCierre:
    es: 'Cierre de inscripciones Monterrey: por confirmar'
  imagen:
    archivo: /src/assets/paginas/certificate/hero/imagen/archivo.jpg
    textoAlternativo:
      es: >-
        Dos mujeres realizan una dinámica teatral o expresiva frente a frente,
        gesticulando con las manos abiertas y posturas enérgicas. Al fondo,
        otras personas replican gestos similares en un salón amplio equipado y
        sillas de trabajo.
    muestraPersonasIdentificables: true
    folioConsentimiento: CONS-2026-004
requisitos:
  titulo:
    es: ¿Qué necesitas para comenzar?
  lista:
    - icono: 🎂
      color: coral
      titulo:
        es: Ser mayor de 18 años
      descripcion:
        es: Nuestro programa de certificación está dirigido a personas adultas.
    - icono: ❤️
      color: mango
      titulo:
        es: Sensibilidad y respeto
      descripcion:
        es: >-
          Disposición para escuchar, acompañar y reconocer la dignidad de cada
          persona.
    - icono: 😃
      color: coral
      titulo:
        es: Apertura para aprender
      descripcion:
        es: >-
          Curiosidad para conocerte, jugar, recibir retroalimentación y
          descubrir nuevas posibilidades.
    - icono: 📅
      color: azul
      titulo:
        es: Compromiso
      descripcion:
        es: >-
          Disponibilidad para participar en la formación, las prácticas y las
          actividades de voluntariado.
    - icono: 🗣️
      color: teal
      titulo:
        es: Una entrevista inicial
      descripcion:
        es: >-
          Queremos conocerte, escuchar tus motivaciones y compartir contigo las
          responsabilidades de ser Doctor Payaso.
costo:
  discriminant: false
  value:
    textoProvisional:
      es: Monto por confirmar. Escríbenos y te lo compartimos.
becas:
  discriminant: false
modulosIntro:
  antetitulo:
    es: El programa
  titulo:
    es: |-
      Seis módulos.
      Un encuentro contigo.
  entrada:
    es: >-
      Nuestra certificación es un recorrido de aprendizaje personal y formación
      para el acompañamiento.


      Cada módulo integra experiencias, reflexión, práctica y herramientas que
      podrás llevar a tu vida cotidiana y a tu labor como voluntario.
  etiquetas:
    - es: Arte clown
    - es: Coaching ontológico
    - es: Metodología Patch Adams
    - es: Práctica hospitalaria
generaciones:
  antetitulo:
    es: Calendario 2027
  titulo:
    es: Próximas generaciones
  nota:
    es: >-
      Cada sede abre una sola generación al año. Los lugares son limitados por
      la capacidad de práctica hospitalaria.
programaUniversidades:
  titulo:
    es: Programa especial para estudiantes de ciencias de la salud
  cuerpo:
    es: >-
      En alianza con facultades de medicina. La 2ª generación de Doctoras y
      Doctores Payaso de la Facultad de Medicina de la UNAM inició en enero de
      2026.
  boton:
    texto:
      es: Info para universidades
    destino: /alianzas
preguntas:
  titulo:
    es: Preguntas que todos hacen
  entrada: {}
formulario:
  titulo:
    es: |-
      Empieza aquí.
      Toma dos minutos.
  entrada:
    es: >-
      Recibirás el temario completo, costos y fechas por correo. Después
      agendamos la entrevista.
  pasos:
    - es: Llenas este formulario
    - es: Entrevista de 20 min por videollamada
    - es: Confirmas lugar en tu generación
  textoDelConsentimiento:
    es: >-
      Acepto el tratamiento de mis datos personales para ser contactado sobre el
      proceso de certificación, conforme a la LFPDPPP.
  textoDeExito:
    es: Recibimos tu solicitud. Te escribimos en los próximos días hábiles.
  textoWhatsApp:
    es: Escríbenos por WhatsApp
