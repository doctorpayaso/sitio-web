seo:
  titulo:
    es: Nuestra misión — sanar con amor y alegría
  descripcion:
    es: >-
      Somos una comunidad de personas que comparte su tiempo y su corazón para
      acompañar a quienes atraviesan momentos de vulnerabilidad. Estos son
      nuestros valores y la idea que nos ordena.
  imagenAlCompartir: null
antetitulo:
  es: Nuestra misión
titulo:
  es: Creemos en el poder de un encuentro humano
entrada:
  es: >-
    Somos Doctor Payaso A.C., una comunidad de personas que comparte su tiempo,
    sus talentos y su corazón para acompañar a quienes atraviesan momentos de
    vulnerabilidad.
imagen:
  archivo: null
  textoAlternativo:
    es: Un doctor payaso durante una visita hospitalaria
  muestraPersonasIdentificables: true
  folioConsentimiento: ''
credo:
  frases:
    - es: Creemos en el amor que se expresa a través de las acciones.
    - es: En la alegría que nace de un encuentro auténtico.
    - es: En la dignidad de cada persona.
    - es: Y en nuestra capacidad de transformar el mundo desde el lugar que ocupamos.
franjaDeLaMision:
  antetitulo:
    es: Nuestra misión es
  frase:
    es: |-
      Sanar con Amor
      y Alegría
  imagenDeFondo:
