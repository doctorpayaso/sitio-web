seo:
  titulo:
    es: Donar — Doctor Payaso A.C.
  descripcion:
    es: >-
      Tu donativo sostiene la formación de un voluntario, su transporte al
      hospital y la coordinación de las visitas. Recibo deducible de impuestos.
antetitulo:
  es: Donativos
titulo:
  es: Tu donativo hace posible el próximo encuentro.
entrada:
  es: >-
    Cada aportación ayuda a sostener la formación, la coordinación y las visitas
    que permiten llevar nuestra misión a más personas.


    Tu generosidad se convierte en presencia, juego, escucha y momentos de
    conexión humana.


    **Gracias por ayudarnos a Sanar con Amor y Alegría.**
botonHero:
  texto:
    es: Quiero donar
  destino: '#montos'
tituloMontos:
  es: Elige cómo quieres participar
montos:
  - monto: 300
    periodicidad: unico
    equivalencia:
      es: >-
        Un donativo que acompaña.


        Tu aportación contribuye a los traslados y a las actividades de nuestros
        voluntarios.
    enlace: >-
      https://www.paypal.com/donate?business=mexico%40doctorpayaso.com&item_name=www.doctorpayaso.com&item_number=DPA1206297AA6&currency_code=MXN&amount=300
    destacado: false
  - monto: 1500
    periodicidad: unico
    equivalencia:
      es: >-
        Un donativo que fortalece.


        Tu aportación contribuye a sostener la coordinación, los materiales y
        las actividades de acompañamiento.
    enlace: >-
      https://www.paypal.com/donate?business=mexico%40doctorpayaso.com&item_name=www.doctorpayaso.com&item_number=DPA1206297AA6&currency_code=MXN&amount=1500
    destacado: true
  - monto: 5000
    periodicidad: unico
    equivalencia:
      es: >-
        Un donativo que abre oportunidades.


        Tu aportación contribuye a la formación de nuevas personas voluntarias y
        al crecimiento de nuestra comunidad.
    enlace: >-
      https://www.paypal.com/donate?business=mexico%40doctorpayaso.com&item_name=www.doctorpayaso.com&item_number=DPA1206297AA6&currency_code=MXN&amount=5000
    destacado: false
metodosDePago:
  - paypal
  - tarjeta
pasarela:
  discriminant: true
  value:
    enlace: >-
      https://www.paypal.com/donate?business=mexico%40doctorpayaso.com&item_name=www.doctorpayaso.com&item_number=DPA1206297AA6&currency_code=MXN
    textoBoton:
      es: Quiero elegir mi donativo
    nota:
      es: Puedes hacerlo con tu cuenta de PayPal o con tarjeta de débito/crédito.
montoLibre:
  titulo:
    es: El monto que tú elijas
  subtitulo:
    es: Cada aportación suma.
tituloGarantias:
  es: Tu confianza también es parte de nuestra misión.
garantias:
  - icono: 👀
    color: coral
    titulo:
      es: Transparencia
    descripcion:
      es: >-
        Compartimos información sobre nuestras actividades y el uso de los
        recursos a través de nuestros informes institucionales.
  - icono: 📄
    color: teal
    titulo:
      es: Comprobante fiscal
    descripcion:
      es: >-
        Podrás solicitar el comprobante correspondiente conforme a las
        disposiciones fiscales aplicables.
  - icono: 🗓️
    color: azul
    titulo:
      es: Donativos recurrentes
    descripcion:
      es: >-
        Si eliges una aportación periódica, podrás consultar y administrar tu
        donativo desde la plataforma de pago correspondiente.
cierre:
  titulo:
    es: Gracias por estar presente.
  lineas:
    - es: Hay personas que comparten su tiempo.
    - es: Hay personas que comparten sus conocimientos.
    - es: Hay personas que comparten sus recursos.
  frase:
    es: Todas hacen posible que nuestra misión llegue más lejos.
  boton:
    texto:
      es: Hacer mi donativo
    destino: >-
      https://www.paypal.com/donate?business=mexico%40doctorpayaso.com&item_name=www.doctorpayaso.com&item_number=DPA1206297AA6&currency_code=MXN
