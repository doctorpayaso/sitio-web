    - iconoImagen: null
      icono: 🕊️
      color: vino
      titulo:
        es: Respeto
      descripcion:
        es: >-
          Honramos la dignidad, la individualidad y las decisiones de cada
          persona.
directores:
  titulo:
    es: Nuestros directores
  personas:
    - alex-garcia
    - pay-campos
metroCuadrado:
  antetitulo:
    es: Una idea que nos ordena
  titulo:
    es: Nuestro metro cuadrado
  entrada:
    es: >-
      Creemos que cada persona tiene la capacidad de transformar el espacio que
      habita. Una mirada, una conversación, una decisión o un gesto de cuidado
      pueden cambiar la experiencia de alguien más.
  cuerpo:
    es: >-
      Cada Doctor Payaso comienza por sí mismo y lleva esa intención a su
      familia, su comunidad y los espacios que visita.
  frase:
    es: El mundo que queremos empieza en nuestro metro cuadrado.
  anillos:
    - es: Los espacios que visito
    - es: Mi comunidad
    - es: Mi familia
  centro:
    es: Yo
somosMedicina:
  titulo:
    es: Somos Medicina
  lineas:
    - es: Nuestra medicina es la presencia.
    - es: Es escuchar con atención.
    - es: Es reconocer al otro.
    - es: Es abrir un espacio para el juego y la alegría.
    - es: Es acompañar con respeto.
  imagenIzquierda:
    archivo: null
    textoAlternativo:
      es: Visita hospitalaria
    muestraPersonasIdentificables: true
    folioConsentimiento: ''
  imagenCentro:
    archivo: null
    textoAlternativo:
      es: Detalle de un encuentro
    muestraPersonasIdentificables: true
    folioConsentimiento: ''
  imagenDerecha:
    archivo: null
    textoAlternativo:
      es: Formación de voluntarios
    muestraPersonasIdentificables: true
    folioConsentimiento: ''
  cierre:
    es: >-
      Cada persona que forma parte de Doctor Payaso tiene una manera única de
      compartir este regalo.
cierre:
  titulo:
    es: Juntos llevamos el corazón en la punta de la nariz.
  cuerpo:
    es: >-
      Formarte como Doctor Payaso toma seis módulos y una decisión. La decisión
      es la parte difícil.
  botonPrincipal:
    texto:
      es: Quiero ser parte
    destino: /certificate
  botonSecundario:
    texto:
      es: Conoce Clown Care
    destino: /clown-care
