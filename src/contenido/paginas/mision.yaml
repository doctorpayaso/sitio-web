    muestraPersonasIdentificables: true
    folioConsentimiento: ''
  lista:
    - iconoImagen: null
      icono: 💗
      color: coral
      titulo:
        es: Amor
      descripcion:
        es: Elegimos acompañar desde la presencia, la escucha y el cuidado.
    - iconoImagen: null
      icono: 🎈
      color: mango
      titulo:
        es: Alegría
      descripcion:
        es: >-
          Compartimos el juego, la creatividad y la capacidad de disfrutar el
          momento presente.
    - iconoImagen: null
      icono: 🧭
      color: azul
      titulo:
        es: Integridad
      descripcion:
        es: Actuamos con honestidad, responsabilidad y congruencia.
    - iconoImagen: null
      icono: 🌱
      color: menta
      titulo:
        es: Humildad
      descripcion:
