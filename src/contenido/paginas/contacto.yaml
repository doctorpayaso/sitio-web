seo:
  titulo:
    es: Contacto — Doctor Payaso A.C.
  descripcion:
    es: >-
      Escríbenos para certificarte, aliar tu institución, agendar una visita
      virtual o resolver cualquier duda.
  imagenAlCompartir: null
titulo:
  es: Hablemos de persona a persona.
entrada:
  es: >-
    Nos encantará escucharte.


    Ya sea que quieras certificarte, solicitar una visita, construir una alianza
    o conocer más sobre nuestra misión, estamos aquí para conversar contigo.
frase:
  es: Cada encuentro comienza con un primer paso.
bloques:
  - titulo:
      es: Quiero ser Doctor Payaso
    descripcion:
      es: >-
        Conoce nuestro proceso de certificación, las próximas generaciones y las
        oportunidades de voluntariado.
    boton:
      texto:
        es: Quiero certificarme
      destino: /certificate
  - titulo:
      es: Quiero construir una alianza
    descripcion:
      es: >-
        Cuéntanos cómo podemos colaborar con tu empresa, hospital o universidad.
    boton:
      texto:
        es: Quiero una alianza
      destino: /alianzas
  - titulo:
      es: Quiero solicitar una visita virtual
    descripcion:
      es: >-
        Comparte con nosotros la información necesaria para conocer tu solicitud
        y explorar las opciones de acompañamiento disponibles.
    boton:
      texto:
        es: Solicitar visita
      destino: https://doctorpayaso.typeform.com/to/owdM1G
  - titulo:
      es: Prensa y medios
    descripcion:
      es: >-
        Si deseas conocer nuestra historia, entrevistar a nuestro equipo o
        compartir nuestra misión, escríbenos.
    boton:
      texto:
        es: Contactar al equipo
      destino: 'mailto:mexico@doctorpayaso.com?subject=Prensa%20y%20medios'
sedes:
  titulo:
    es: Estamos cerca de ti.
  entrada:
    es: 'Contamos con actividades y equipos de voluntariado en:'
  frase:
    es: El amor y la alegría también pueden viajar a través de una pantalla.
escribenos:
  titulo:
    es: Escríbenos
  cierre:
    es: Gracias por acercarte a Doctor Payaso.
