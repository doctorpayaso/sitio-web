seo:
  titulo:
    es: Impacto y transparencia — Doctor Payaso A.C.
  descripcion:
    es: >-
      Publicamos un informe anual desde 2015, en español e inglés, de descarga
      abierta. Los números antes que las fotos.
antetitulo:
  es: Impacto y transparencia
titulo:
  es: Cada número representa un encuentro humano.
entrada:
  es: >-
    Detrás de cada cifra hay una persona, una historia y un momento compartido.


    Medimos nuestro trabajo porque creemos en la responsabilidad de conocer
    nuestro alcance, aprender de la experiencia y compartir los resultados con
    quienes hacen posible nuestra misión.


    **El amor nos mueve. La integridad nos guía.**
comunidad:
  titulo:
    es: Nuestra comunidad
  cifras:
    - voluntariosCertificados
    - voluntariosActivos
alcance:
  titulo:
    es: Nuestro alcance
  cifras:
    - visitasHospitalarias
    - visitasVirtuales
    - horasDeVisita
    - personasBeneficiadas
medicion:
  titulo:
    es: ¿Cómo medimos nuestro trabajo?
  criterios:
    - icono: 🎓
      color: vino
      titulo:
        es: Formación
      descripcion:
        es: >-
          Registramos el número de personas que concluyen satisfactoriamente
          nuestro programa de certificación.
    - icono: 🤝
      color: coral
      titulo:
        es: Voluntariado
      descripcion:
        es: >-
          Damos seguimiento a la participación de nuestra comunidad en las
          actividades de acompañamiento.
    - icono: 🏥
      color: azul
      titulo:
        es: Visitas
      descripcion:
        es: >-
          Documentamos las actividades realizadas, su modalidad, sede y
          duración.
    - icono: 🌎
      color: teal
      titulo:
        es: Alcance
      descripcion:
        es: >-
          Registramos el número de personas acompañadas conforme a los criterios
          establecidos para cada programa.
    - icono: 📊
      color: mango
      titulo:
        es: Recursos
      descripcion:
        es: >-
          Compartimos información sobre los recursos que hacen posible nuestra
          operación y su aplicación.
  frase:
    es: Medir nos ayuda a aprender, mejorar y llegar más lejos.
informes:
  titulo:
    es: Informes anuales
  entrada:
    es: >-
      La transparencia es una forma de cuidar la confianza.


      Compartimos nuestros informes institucionales para que voluntarios,
      donantes, aliados y comunidad conozcan nuestro trabajo. En ellos
      encontrarás información sobre actividades, alcance, voluntariado y
      recursos.
gobernanza:
  titulo:
    es: Gobernanza y responsabilidad
  frase:
    es: La integridad se demuestra con acciones.
  cuerpo:
    es: >-
      Nuestra operación se guía por valores, lineamientos institucionales y
      responsabilidades definidas.


      Promovemos la rendición de cuentas, el uso responsable de los recursos y
      el respeto a las personas que forman parte de nuestra comunidad.
  boton:
    texto:
      es: Conoce nuestra misión
    destino: /mision
cierre:
  titulo:
    es: Gracias por hacer posible cada encuentro.
  cuerpo:
    es: >-
      Cada hora de voluntariado, cada donativo y cada alianza forman parte de
      una historia colectiva.
  frase:
    es: Tu participación también cuenta.
  boton:
    texto:
      es: Quiero sumarme
    destino: /certificate
